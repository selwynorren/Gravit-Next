<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />
    <title>Gravit Designer</title>
    <link id="theme-stylesheet" rel="stylesheet" href="/designer.browser.light.css" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <script>
      // The look: Gravit Next or the classic Gravit Designer. Decided
      // here, before the first paint, by the rules of resolveBranding in
      // src/app/brand/branding.ts (branding.test.ts runs this script too).
      (function () {
        var w = window;
        var d = document;
        var key = "designer.branding";
        var ok = function (v) {
          return v === "next" || v === "classic";
        };
        var read = function (k) {
          try {
            return JSON.parse(w.localStorage.getItem(k) || "null");
          } catch (e) {
            return null;
          }
        };
        var branding = "next";
        var query = null;
        try {
          query = new URLSearchParams(w.location.search).get("branding");
        } catch (e) {}
        if (ok(query)) {
          branding = query;
          try {
            w.localStorage.setItem(key, JSON.stringify(query));
          } catch (e) {}
        } else if (ok(w.__gdBranding)) branding = w.__gdBranding;
        else if (ok(read(key))) branding = read(key);
        // The classic look leaves the page as the stylesheets alone make it.
        if (branding !== "next") return;
        d.documentElement.setAttribute("data-branding", branding);
        var settings = read("designer.settings");
        // No theme chosen ("default"): the device's, like themes/theme.ts.
        var theme = settings && settings.theme;
        var dark = !!(w.matchMedia && w.matchMedia("(prefers-color-scheme: dark)").matches);
        theme = !theme || theme === "default" ? (dark ? "dark" : "light") : String(theme);
        d.documentElement.setAttribute("data-gd-theme", theme);
        // The stored theme's stylesheet from the start, so the switch when
        // the settings are restored changes nothing (the page went unstyled
        // for a moment while the light sheet was swapped out).
        var themeSheet = d.querySelector("#theme-stylesheet");
        if (themeSheet && theme !== "light")
          themeSheet.setAttribute("href", "/designer.browser." + theme + ".css");
        var head = d.head;
        var link = function (rel, href, id) {
          var l = d.createElement("link");
          l.rel = rel;
          l.href = href;
          if (id) l.id = id;
          head.appendChild(l);
        };
        // The accent first: next.css overrides some of the rules it restates.
        link("stylesheet", "/brand/accent." + theme + ".css", "brand-accent");
        link("stylesheet", "/brand/next.css");
        link("icon", "/brand/icons/favicon.ico");
        var manifest = d.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute("href", "/brand/manifest.json");
        d.title = "Gravit Next";
      })();
    </script>
    <!-- The next look's loading screen. Inline, because the brand
         stylesheets the script adds don't hold back the first paint and
         the old stylesheet's pink would show until they arrive. The page
         gets the theme stylesheet's full height here too, or the mark is
         centred on an empty page at the top until that sheet applies.
         The mark is in the page (#gd-loader), not a background image: CSS
         animations start with the first paint, and transform and opacity
         animations keep running smoothly while the app starts. It pops in
         and then breathes. -->
    <style>
      html[data-branding="next"] {
        height: 100%;
      }
      html[data-branding="next"] body.loading {
        background: #2c2c2c;
      }
      #gd-loader {
        display: none;
      }
      html[data-branding="next"] body.loading > #gd-loader {
        display: flex;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
      }
      .gd-loader-mark {
        width: 128px;
        height: 128px;
        animation:
          gd-mark-in 400ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both,
          gd-mark-breathe 1800ms ease-in-out 400ms infinite;
      }
      @keyframes gd-mark-in {
        from {
          transform: scale(0);
          opacity: 0;
        }
      }
      @keyframes gd-mark-breathe {
        50% {
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gd-loader * {
          animation: none !important;
        }
      }
    </style>
  </head>

    <script>
      // The loader is the next look's only; the classic look has none.
      (function () {
        if (document.documentElement.getAttribute("data-branding") !== "next")
          document.getElementById("gd-loader").remove();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
